version: 1
description: 'Canonical basket universe: identity, taxonomy, intake keywords, holdings, and the eligible
  candidate set. Single source of truth -- every other module derives from this file.'
classification:
  default_model: gpt-5.4-nano
  env_model_var: OPENAI_TICKER_MODEL
  provider: openai_responses
methodology:
  start_date: '2026-01-01'
  end_date: '2026-07-24'
  expected_constituents_per_basket: 8
  source: Yahoo Finance chart API
  weighting: Equal-weighted basket constituents
  price_field: Adjusted close when supplied, otherwise close
  data_status: July 24, 2026 is the latest completed U.S. equity session as of July 25, 2026. The pipeline
    auto-updates this date before rebuilds.
benchmarks:
  - ticker: SPY
    name: SPDR S&P 500 ETF
    note: market benchmark
  - ticker: QQQ
    name: Invesco QQQ Trust
    note: growth benchmark
  - ticker: BTC-USD
    name: Bitcoin
    note: crypto benchmark
symbol_decisions:
  - CYBR was acquired by Palo Alto Networks and delisted before the analysis window; NET is used as a
    liquid cybersecurity replacement.
  - TNP is represented by TEN, the current NYSE ticker for Tsakos Energy Navigation.
  - EURN is represented by CMBT after Euronav changed to CMB.TECH.
  - INFQ represents Infleqtion common shares after its NYSE listing; INFQ.WS warrants are excluded.
